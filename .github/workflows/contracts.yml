name: Contracts

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "packages/anchoring/**"
      - "packages/backend/convex/anchors.ts"
      - "apps/web/src/components/add-step-form.tsx"
      - "apps/web/src/lib/wagmi.ts"
      - "package.json"
      - "turbo.json"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Contract build
        run: bun run contracts:build

      - name: Contract tests
        run: bun run contracts:test

      - name: Contract format check
        run: bun run contracts:fmt:check
